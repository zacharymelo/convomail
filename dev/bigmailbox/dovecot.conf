# Dev only: Dovecot 2.4 without a full-text index (like most hosted mail servers), classic maildir layout,
# password login. Started by dev/bigmailbox/start.sh.
# 2.4.5 (0cbb641): /etc/dovecot/dovecot.conf
# Pigeonhole version 2.4.5 (742bb89)
# OS: Linux 6.12.76-linuxkit aarch64 Debian 13.7 
# Hostname: 15c829e53d1c
# 7 default setting changes since version 2.4.3
dovecot_config_version = 2.4.3
default_internal_group = vmail
default_internal_user = vmail
default_login_user = vmail
doveadm_password = $ENV:DOVEADM_PASSWORD
dovecot_storage_version = 2.4.3
imap4rev2_enable = yes
imap_hibernate_timeout = 5s
import_environment {
  CORE_ERROR = %{env:CORE_ERROR}
  CORE_OUTOFMEM = %{env:CORE_OUTOFMEM}
  DOVEADM_PASSWORD = %{env:DOVEADM_PASSWORD | default}
  MALLOC_MMAP_THRESHOLD_ = 131072
  PATH = %{env:PATH}
  TZ = %{env:TZ}
  USER_PASSWORD = %{env:USER_PASSWORD | default('{CRYPT}*')}
}
language_filters = normalizer-icu snowball stopwords
language_tokenizers = generic email-address
log_path = /dev/stdout
mail_driver = maildir
mail_gid = vmail
mail_home = /srv/vmail/%{user | lower}
mail_log_events = delete undelete expunge save copy mailbox_create mailbox_delete mailbox_rename flag_change
mail_path = ~/mail
mail_plugins {
  mail_log = yes
  notify = yes
}
mail_uid = vmail
mail_utf8_extensions = yes
mailbox_list_layout = maildir++
mailbox_list_utf8 = yes
protocols = imap submission lmtp sieve
state_dir = /run/dovecot
mail_attribute {
  dict file {
    path = %{home}/dovecot-attributes
  }
}
protocol imap {
  mail_plugins {
    imap_sieve = yes
    imap_filter_sieve = yes
  }
}
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}
service imap-login {
  client_limit = 100
  process_min_avail = 1
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 31993
  }
}
service pop3-login {
  client_limit = 100
  process_min_avail = 1
  inet_listener pop3 {
    port = 31110
  }
  inet_listener pop3s {
    port = 31995
  }
}
service submission-login {
  client_limit = 100
  process_min_avail = 1
  inet_listener submission {
    port = 31587
  }
  inet_listener submissions {
    port = 31465
    ssl = yes
  }
}
service managesieve-login {
  client_limit = 100
  process_min_avail = 1
  inet_listener sieve {
    port = 34190
  }
}
service doveadm {
  inet_listener http {
    port = 8080
    ssl = yes
  }
}
service stats {
  process_min_avail = 1
  inet_listener http {
    port = 9090
    ssl = yes
  }
}
service lmtp {
  inet_listener lmtps {
    port = 31024
    ssl = yes
  }
}
passdb static {
  password = %{env:USER_PASSWORD}
}
language en {
  default = yes
  filters = lowercase snowball english-possessive stopwords
}
namespace inbox {
  separator = /
}
event_exporter log {
  format = json
  time_format = rfc3339
}
metric auth_failures {
  exporter = log
  filter = event=auth_request_finished AND NOT success=yes
}
metric mail_deliveries {
  filter = event=mail_delivery_finished
  metric_group_by duration {
    metric_group_by_method exponential {
      base = 10
      max_magnitude = 5
      min_magnitude = 1
    }
  }
}
metric imap_command {
  filter = event=imap_command_finished
  metric_group_by cmd_name {
    metric_group_by_method discrete {
    }
  }
  metric_group_by tagged_reply_state {
    metric_group_by_method discrete {
    }
  }
}
metric smtp_command {
  filter = event=smtp_server_command_finished and protocol=submission
  metric_group_by cmd_name {
    metric_group_by_method discrete {
    }
  }
  metric_group_by status_code {
    metric_group_by_method discrete {
    }
  }
  metric_group_by duration {
    metric_group_by_method exponential {
      base = 10
      max_magnitude = 5
      min_magnitude = 1
    }
  }
}
metric lmtp_command {
  filter = event=smtp_server_command_finished and protocol=lmtp
  metric_group_by cmd_name {
    metric_group_by_method discrete {
    }
  }
  metric_group_by status_code {
    metric_group_by_method discrete {
    }
  }
  metric_group_by duration {
    metric_group_by_method exponential {
      base = 10
      max_magnitude = 5
      min_magnitude = 1
    }
  }
}
ssl_server {
  cert_file = /etc/dovecot/ssl/tls.crt
  key_file = /etc/dovecot/ssl/tls.key
}
@mailbox_defaults = english
@metric_defaults = backend

auth_allow_cleartext = yes
