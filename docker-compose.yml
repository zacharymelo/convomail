services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dolibarr_root
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  dolibarr:
    image: dolibarr/dolibarr:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8114:80"
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: dolibarr
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin
      DOLI_URL_ROOT: "http://localhost:8114"
      WWW_USER_ID: 1000
      WWW_GROUP_ID: 1000
    volumes:
      - dolibarr_html:/var/www/html
      - dolibarr_docs:/var/www/documents
      - ./module:/var/www/html/custom/convomail

  # Test mail server for development: SMTP on 3025, IMAP on 3143, no TLS.
  # Authentication is disabled, so any login/password is accepted and the mailbox is created on first use.
  greenmail:
    image: greenmail/standalone:2.1.2
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose"
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"

volumes:
  db_data:
  dolibarr_html:
  dolibarr_docs:
